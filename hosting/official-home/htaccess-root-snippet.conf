# Inserir acima de `# BEGIN WordPress` no public_html/.htaccess.
# Escopo: somente a raiz vazia do apex. O redirect atual de www para o apex e todas
# as demais rotas continuam sendo resolvidos pelo WordPress/Hostinger.
RewriteEngine On
RewriteCond %{HTTP_HOST} ^inspiracred\.com\.br$ [NC]
RewriteRule ^$ /_institucional/index.html [L]
