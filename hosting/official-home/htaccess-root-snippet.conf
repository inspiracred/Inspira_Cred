# Inserir acima de `# BEGIN WordPress` no public_html/.htaccess.
# Redireciona somente URLs legadas exatas do apex que ainda aparecem como sitelinks
# no Google. O redirect atual de www para o apex e as demais rotas continuam sendo
# resolvidos pelo WordPress/Hostinger.
RewriteEngine On

RewriteCond %{HTTP_HOST} ^inspiracred\.com\.br$ [NC]
RewriteRule ^(?:lp|sitebackup|obrigado)/?$ https://inspiracred.com.br/ [R=301,L]

RewriteCond %{HTTP_HOST} ^inspiracred\.com\.br$ [NC]
RewriteRule ^(?:lp-cgi|homeequity)/?$ https://nova.inspiracred.com.br/ [R=301,L]

RewriteCond %{HTTP_HOST} ^inspiracred\.com\.br$ [NC]
RewriteRule ^politica-de-privacidade/?$ https://nova.inspiracred.com.br/politica-de-privacidade [R=301,L]

RewriteCond %{HTTP_HOST} ^inspiracred\.com\.br$ [NC]
RewriteRule ^(?:termos-e-condicoes|termos-de-uso)/?$ https://nova.inspiracred.com.br/termos-de-uso [R=301,L]

RewriteCond %{HTTP_HOST} ^inspiracred\.com\.br$ [NC]
RewriteRule ^$ /_institucional/index.html [L]
