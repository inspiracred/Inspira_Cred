# Inserir acima de `# BEGIN WordPress` no public_html/.htaccess.
# Escopo: somente a raiz vazia dos hosts oficiais. Todas as demais rotas continuam
# sendo resolvidas pelo WordPress/Hostinger.
RewriteEngine On
RewriteCond %{HTTP_HOST} ^(?:www\.)?inspiracred\.com\.br$ [NC]
RewriteRule ^$ /_institucional/index.html [L]
